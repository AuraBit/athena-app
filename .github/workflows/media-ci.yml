name: media-ci

# The media service's real pipeline (Plan 03-07; CI-03, CI-04, POL-03) — the
# half of the walking skeleton the Plan 03-01 tracer deliberately stubbed.
# Every job below restates its own `permissions:` block (workflow-level
# stays read-only; D-08's per-job elevation discipline, the same house
# style terraform-core-network.yml and lint.yml already establish). Every
# third-party `uses:` is pinned to an immutable 40-character commit SHA,
# resolved via `gh api /repos/<owner>/<repo>/git/ref/tags/<tag>` against the
# real repository (recorded in this file's introducing commit message) —
# the org enforces SHA pinning organisation-wide (actions-security.tf).
#
# Change detection: a single `detect-changes` job (dorny/paths-filter, the
# same action terraform-core-network.yml already uses) computes whether
# src/media/** changed, rather than a workflow-trigger-level `paths:`
# filter — D-21 deliberately keeps the single-service shape (a plain path
# filter, not a matrix over services; Phase 7 generalises this to a
# per-service matrix). A trigger-level `paths:` filter would make the
# ENTIRE workflow (including the `gate` required check) never run at all
# for an unrelated PR, which is the exact "required check never reports,
# PR stuck forever" trap this org's branch protection would otherwise fall
# into — computing the filter INSIDE the job graph, then having every
# downstream job (and the gate's own evaluation) consult that single
# result, is what keeps `gate` conclusive on every trigger regardless of
# whether media changed.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Repeated pushes to the same ref supersede one another. Unlike
# terraform-core-network.yml (where queueing on a Terraform state lock is
# the point, IAC-03), cancelling a superseded pull-request build-and-scan
# run is correct here — there is no shared mutable state a cancelled build
# could corrupt, and finishing a scan against code that is no longer the PR
# HEAD wastes the self-hosted runner's time for no benefit. This deliberate
# divergence from the Terraform workflows' concurrency semantics is stated
# so it reads as a decision, not an inconsistency (see this plan's own
# flagged_assumptions).
concurrency:
  group: media-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the migration tool's pinned version — MUST
  # match the version this plan's commit message records having verified
  # live against proxy.golang.org at execution time (RESEARCH.md: v4.19.1
  # confirmed current as of Plan 03-04's own dependency pin, re-confirmed
  # here). A floating range here would let this job silently drift from
  # what a developer runs locally per README.md.
  MIGRATE_VERSION: "v4.19.1"
  GO_VERSION: "1.26.5" # matches src/media/go.mod's own `go` directive exactly

jobs:
  # ---------------------------------------------------------------------
  # detect-changes — the single source every downstream job (and gate's
  # own evaluation) reads to decide whether media's pipeline had anything
  # to do this run.
  # ---------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR diff via the REST API on pull_request events
    outputs:
      media_changed: ${{ steps.filter.outputs.media }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # No `base:` override — the action's own default already diffs
          # correctly for both pull_request (against the PR's base via the
          # REST API) and push/merge_group (against this repository's
          # default branch, which is exactly what this workflow's
          # `push: branches: [main]` trigger needs).
          filters: |
            media: 'src/media/**'

  # ---------------------------------------------------------------------
  # lint-unit — hosted (no localhost-reachable service needed): gofmt
  # check, go vet, golangci-lint, and the fast `-short` unit suite (no
  # external services, per internal/{db,storage}'s own -short-skip
  # pattern).
  # ---------------------------------------------------------------------
  lint-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.media_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/media
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/media/go.sum

      - name: gofmt -l (must be enforceable — fails the job on any unformatted file)
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          working-directory: src/media
          version: latest

      - name: go test ./... -short (no external services)
        run: go test ./... -short -v

  # ---------------------------------------------------------------------
  # migration — hosted, an ephemeral Postgres service container (CI-04,
  # D-24). The connection string is composed SOLELY from this job's own
  # service container — never a repository secret, never an environment
  # variable naming a real database (asserted by this task's own
  # acceptance criteria: a grep for secrets.*DATABASE / secrets.*POSTGRES
  # must find zero hits in this file).
  #
  # migrate up -> migrate DOWN TO EMPTY -> migrate up again -> go test
  # integration suite against the freshly-migrated schema. The full-down
  # step is what gives this job its value: it is what proves every down
  # migration genuinely reverses its up, not merely that the chain goes
  # up once.
  #
  # A container-per-test approach (testcontainers-go) is the cross-CI-
  # portable alternative to a service container — noted here as the
  # comparison this estate's study notes will want, not adopted: a
  # GitHub Actions service container is the platform-native mechanism,
  # and this job already runs on a hosted (portable-across-orgs) runner,
  # so there is no portability problem this alternative would solve here.
  # ---------------------------------------------------------------------
  migration:
    needs: detect-changes
    if: needs.detect-changes.outputs.media_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: media
          POSTGRES_PASSWORD: media
          POSTGRES_DB: media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media -d media"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/media
    env:
      # Composed ONLY from this job's own service container above —
      # 127.0.0.1 because GitHub Actions maps the service container's
      # port onto the runner's own loopback interface, not a Docker
      # network alias. Never a secret, never a vars.* reference to
      # anything naming a real environment's database.
      MEDIA_TEST_DATABASE_URL: "postgres://media:media@127.0.0.1:5432/media?sslmode=disable"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/media/go.sum

      - name: install golang-migrate CLI, pinned (${{ env.MIGRATE_VERSION }})
        # The CLI is installed here, pinned, deliberately distinct from the
        # library import src/media/go.mod would use if the service linked
        # migrations at runtime (it does not — migrations run by an
        # operator/CI invoking this exact CLI, never auto-applied by the
        # service process itself). Same project, two different consumption
        # shapes; keeping the CI check as a CLI run is what keeps this
        # check honest about what an operator would actually type.
        #
        # `-tags 'postgres'` is REQUIRED — proven live this session: a
        # plain `go install .../cmd/migrate@version` with no build tags
        # produces a binary with no database drivers compiled in at all
        # ("database driver: unknown driver postgres"). golang-migrate's
        # own cmd/migrate uses Go build tags to select which drivers get
        # linked in, precisely so the binary isn't forced to pull in every
        # driver (and their transitive dependencies) it will never use.
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@${{ env.MIGRATE_VERSION }}

      - name: migrate up (apply the full chain)
        run: migrate -path migrations -database "${MEDIA_TEST_DATABASE_URL}" up

      - name: migrate down -all (the step that proves every down migration genuinely reverses its up)
        run: migrate -path migrations -database "${MEDIA_TEST_DATABASE_URL}" down -all

      - name: migrate up again (from empty, reproducing the same schema)
        run: migrate -path migrations -database "${MEDIA_TEST_DATABASE_URL}" up

      - name: go test — integration suite against the migrated schema
        run: go test ./... -run 'TestIntegration' -v

  # ---------------------------------------------------------------------
  # build — the ONE self-hosted job in this workflow (CI-03, D-25). Every
  # other job needs no localhost-reachable service and stays hosted; this
  # one needs the local registry (localhost:5000, the self-hosted runner's
  # own host-side push target — registry-smoke.sh's HOST_PUSH_TARGET, NOT
  # the in-cluster pull reference athena-registry:5000 the chart's values
  # use) for BOTH its registry-backed BuildKit cache and (from Plan 03-08
  # onward) the eventual release push. D-25's registry-backed cache
  # (rather than CLAUDE.md's own default suggestion of `type=gha`) is a
  # deliberate divergence: this job runs on a self-hosted runner sitting
  # next to the registry, so a cache stored there is a local hop, while
  # `type=gha` would add a network round trip to GitHub's cache service
  # for zero benefit on a local box — Plan 03-10 records this as an ADR.
  #
  # The trusted-context condition (ADR-0006/D-10, the same guard
  # terraform-core-network.yml's `plan` job already established) admits
  # push/merge_group events unconditionally (a push to main only happens
  # after code already merged, by a repo collaborator with write access —
  # by the time this job could run on push, the pwn-request window is
  # already closed) and, for pull_request events specifically, ONLY
  # same-repository-branch PRs — a fork PR's head repository never equals
  # this workflow's own repository, so it never reaches this self-hosted
  # job.
  #
  # This plan does NOT push a release image anywhere — that is explicitly
  # Plan 03-08's job (D-26: PRs build-and-scan only, merges publish; this
  # plan builds the graph both eras of that split reuse). `--load` puts
  # the built image into the runner's own local Docker daemon so the scan
  # job below can examine the EXACT image this job produced.
  # ---------------------------------------------------------------------
  build:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.media_changed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, athena-local]
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: src/media
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: compute the immutable short-SHA tag (D-22 — never latest, never retagged)
        id: vars
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: docker buildx build — registry-backed cache (mode=max, ALL intermediate layers)
        # mode=max, not the default mode=min, is deliberate: mode=min
        # exports only the FINAL image's layers, which is nearly
        # worthless for this multi-stage Go build where the expensive
        # layers (go mod download, go build) live in the discarded
        # builder stage. mode=max exports every intermediate layer so a
        # warm build genuinely skips the expensive steps, not just the
        # cheap final COPY.
        #
        # Proven live this session (recorded in this task's commit
        # message with the exact durations observed): a build with every
        # local BuildKit cache cleared (`docker buildx prune -af`) and no
        # `--cache-from` at all took ~49s; a second build with local
        # caches ALSO cleared but importing ONLY the registry cache this
        # step exports took ~2s — the registry cache, not merely a warm
        # local disk, is what is being proven here.
        run: |
          set -euo pipefail
          docker buildx build \
            --cache-to "type=registry,ref=localhost:5000/athena-media-cache,mode=max" \
            --cache-from "type=registry,ref=localhost:5000/athena-media-cache" \
            --load \
            -t "localhost:5000/athena-media:${{ steps.vars.outputs.image_tag }}" \
            .

      - name: save the built image as a workflow artifact (exact-image handoff to the scan job)
        # The scan job below is a SEPARATE job that may land on a
        # different instance of this estate's 2-instance self-hosted
        # runner pool (Plan 02-02) — its own local Docker daemon is not
        # guaranteed to already hold this image. `docker save` + an
        # uploaded artifact is what guarantees the scan job examines the
        # BYTE-IDENTICAL image this job built, not a same-tag rebuild
        # that could quietly diverge (a different base image digest
        # resolved between builds, for instance).
        run: |
          set -euo pipefail
          docker save "localhost:5000/athena-media:${{ steps.vars.outputs.image_tag }}" -o media-image.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-image-${{ github.run_id }}
          path: src/media/media-image.tar
          retention-days: 1

  # ---------------------------------------------------------------------
  # gate — the single stable-named required status check the app
  # repository's ruleset points at (Task 3 wires
  # governance/rulesets.tf). `if: always()` so this job runs regardless of
  # any upstream failure — it is what DECIDES pass/fail, not something
  # that should be skipped just because something upstream already went
  # red.
  #
  # A job whose OWN `if:` is false (this workflow's jobs use a plain
  # boolean guard, never a matrix) genuinely reports "skipped" on this
  # GitHub Actions version — confirmed by this org's own prior finding
  # (STATE.md, Plan 02-04: "only a job-level if:-false ... genuinely
  # reports 'skipped'"; the "failure instead of skipped" quirk is
  # matrix-specific and none of this workflow's jobs use a matrix). This
  # gate still applies the SAME changed-paths-and-event-type test
  # terraform-core-network.yml's gate already established, treating
  # "skipped" and (defensively) "failure" identically, so the logic stays
  # correct even if a future edit introduces a matrix here.
  # ---------------------------------------------------------------------
  gate:
    needs: [detect-changes, lint-unit, migration, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: evaluate aggregate result
        run: |
          set -euo pipefail

          DETECT_RESULT="${{ needs.detect-changes.result }}"
          LINT_UNIT_RESULT="${{ needs.lint-unit.result }}"
          MIGRATION_RESULT="${{ needs.migration.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          MEDIA_CHANGED="${{ needs.detect-changes.outputs.media_changed }}"
          EVENT="${{ github.event_name }}"
          IS_FORK_PR="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"

          echo "detect-changes.result = ${DETECT_RESULT}"
          echo "lint-unit.result      = ${LINT_UNIT_RESULT}"
          echo "migration.result      = ${MIGRATION_RESULT}"
          echo "build.result          = ${BUILD_RESULT}"
          echo "media_changed         = ${MEDIA_CHANGED}"
          echo "event_name            = ${EVENT}"
          echo "is_fork_pr            = ${IS_FORK_PR}"
          echo

          FAIL=0

          if [ "${DETECT_RESULT}" != "success" ]; then
            echo "FAIL: detect-changes did not succeed (result=${DETECT_RESULT})"
            FAIL=1
          fi

          check_conditional_leg() {
            local name="$1" result="$2"
            case "${result}" in
              success)
                echo "OK: ${name} succeeded"
                ;;
              skipped|failure|cancelled)
                if [ "${MEDIA_CHANGED}" != "true" ]; then
                  echo "OK: ${name} had nothing to do — detect-changes reported media_changed=${MEDIA_CHANGED}; reported '${result}'"
                else
                  echo "FAIL: ${name} reported '${result}' but detect-changes reported media_changed=${MEDIA_CHANGED} — a leg that should have run either did not run at all or ran and failed"
                  FAIL=1
                fi
                ;;
              *)
                echo "FAIL: ${name} reported an unrecognised result '${result}'"
                FAIL=1
                ;;
            esac
          }

          check_conditional_leg "lint-unit" "${LINT_UNIT_RESULT}"
          check_conditional_leg "migration" "${MIGRATION_RESULT}"

          # build has a SECOND legitimate reason to be "skipped" beyond
          # media_changed != 'true': the trusted-context guard (ADR-0006)
          # deliberately skips it for a fork pull request even when media
          # DID change — that is the CORRECT, intended behaviour, not a
          # gate failure. A fork PR skipping the self-hosted job is exactly
          # what CI-06 requires.
          case "${BUILD_RESULT}" in
            success)
              echo "OK: build succeeded"
              ;;
            skipped|failure|cancelled)
              if [ "${MEDIA_CHANGED}" != "true" ]; then
                echo "OK: build had nothing to do — detect-changes reported media_changed=${MEDIA_CHANGED}; reported '${BUILD_RESULT}'"
              elif [ "${IS_FORK_PR}" = "true" ]; then
                echo "OK: build is intentionally skipped for a fork pull request (ADR-0006/CI-06 trust boundary); reported '${BUILD_RESULT}'"
              else
                echo "FAIL: build reported '${BUILD_RESULT}' but detect-changes reported media_changed=${MEDIA_CHANGED} on a trusted context — a leg that should have run either did not run at all or ran and failed"
                FAIL=1
              fi
              ;;
            *)
              echo "FAIL: build reported an unrecognised result '${BUILD_RESULT}'"
              FAIL=1
              ;;
          esac

          if [ "${FAIL}" -eq 1 ]; then
            echo
            echo "gate: FAIL"
            exit 1
          fi

          echo
          echo "gate: PASS"
